name: VIDAI Production Deploy


on:

  push:

    branches:
      - main
      - master


  workflow_dispatch:




permissions:

  contents: read




jobs:


  deploy:


    name: Build And Deploy


    runs-on: ubuntu-latest


    env:

      PROJECT_NAME: vidai




    steps:


      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout Repository

        uses: actions/checkout@v4





      # ==========================
      # NODE
      # ==========================

      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 22





      # ==========================
      # INSTALL TOOLS
      # ==========================

      - name: Install Tools

        run: |

          npm install -g terser
          npm install -g javascript-obfuscator
          npm install -g clean-css-cli
          npm install -g html-minifier-terser
          npm install -g wrangler





      # ==========================
      # CREATE DIST
      # ==========================

      - name: Prepare Dist

        run: |

          rm -rf dist

          mkdir dist

          cp -r public/* dist/





      # ==========================
      # HTML MINIFY
      # ==========================

      - name: Minify HTML

        run: |

          find dist -type f -name "*.html" | while read file
          do

            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              "$file" \
              -o "$file"

          done





      # ==========================
      # CSS MINIFY
      # ==========================

      - name: Minify CSS

        run: |

          find dist -type f -name "*.css" | while read file
          do

            cleancss \
              -O2 \
              "$file" \
              -o "$file"

          done





      # ==========================
      # JS MINIFY
      # ==========================

      - name: Minify JavaScript

        run: |

          find dist -type f -name "*.js" | while read file
          do

            terser "$file" \
              --compress \
              --mangle \
              -o "$file"

          done





      # ==========================
      # JS OBFUSCATE
      # ==========================

      - name: Obfuscate JavaScript

        run: |

          find dist -type f -name "*.js" | while read file
          do

            javascript-obfuscator "$file" \
              --output "$file" \
              --compact true \
              --control-flow-flattening true \
              --control-flow-flattening-threshold 0.5 \
              --identifier-names-generator hexadecimal \
              --rename-globals false \
              --self-defending true \
              --string-array true \
              --string-array-encoding base64 \
              --disable-console-output true

          done





      # ==========================
      # CACHE VERSION
      # ==========================

      - name: Generate Version

        run: |

          echo "BUILD_VERSION=$(date +%s)" >> $GITHUB_ENV





      - name: Cache Bust

        run: |

          find dist -type f -name "*.html" | while read file
          do

            sed -i "s|main.css|main.css?v=${BUILD_VERSION}|g" "$file"

            sed -i "s|app.js|app.js?v=${BUILD_VERSION}|g" "$file"

            sed -i "s|config.js|config.js?v=${BUILD_VERSION}|g" "$file"

            sed -i "s|manifest.json|manifest.json?v=${BUILD_VERSION}|g" "$file"

          done





      # ==========================
      # CLOUDFLARE HEADERS
      # ==========================

      - name: Create Security Headers

        run: |

          printf '%s\n' \
          "/*" \
          "  X-Frame-Options: SAMEORIGIN" \
          "  X-Content-Type-Options: nosniff" \
          "  Referrer-Policy: strict-origin-when-cross-origin" \
          > dist/_headers





      # ==========================
      # CREATE PAGES PROJECT
      # ==========================

      - name: Create Cloudflare Pages Project If Missing

        env:

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          if wrangler pages project list | grep -q "$PROJECT_NAME"
          then

            echo "Cloudflare Pages project exists"

          else

            echo "Creating Cloudflare Pages project"

            wrangler pages project create "$PROJECT_NAME" \
              --production-branch main

          fi





      # ==========================
      # DEPLOY
      # ==========================

      - name: Deploy Cloudflare Pages

        env:

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          wrangler pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --commit-dirty=true





      # ==========================
      # SUCCESS
      # ==========================

      - name: Success

        run: |

          echo "VIDAI DEPLOYMENT COMPLETED SUCCESSFULLY"
