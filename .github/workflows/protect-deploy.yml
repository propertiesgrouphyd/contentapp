name: VIDHWAAN AI Writer Production Deploy


on:

  workflow_dispatch:

  push:

    branches:

      - main



permissions:

  contents: read



jobs:


  deploy:


    name: Protect Build And Deploy


    runs-on: ubuntu-latest



    env:

      PROJECT_NAME: create-vidhwaan



    steps:


      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout Repository

        uses: actions/checkout@v4



      # ==========================
      # NODE
      # ==========================

      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 24



      # ==========================
      # INSTALL TOOLS
      # ==========================

      - name: Install Protection Tools

        run: |

          npm install -g \
          terser \
          javascript-obfuscator \
          clean-css-cli \
          html-minifier-terser \
          wrangler



      # ==========================
      # CREATE DIST
      # ==========================

      - name: Prepare Production Folder

        run: |

          rm -rf dist

          mkdir dist

          cp -r ./* dist/



      # ==========================
      # REMOVE DEVELOPMENT FILES
      # ==========================

      - name: Remove Unnecessary Files

        run: |

          rm -rf dist/.git

          rm -rf dist/node_modules

          find dist \
          -name "*.map" \
          -delete



      # ==========================
      # HTML MINIFY
      # ==========================

      - name: Minify HTML

        run: |

          find dist -type f -name "*.html" | while read file

          do

            html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            "$file" \
            -o "$file"

          done



      # ==========================
      # CSS MINIFY
      # ==========================

      - name: Minify CSS

        run: |

          find dist -type f -name "*.css" | while read file

          do

            cleancss \
            -O2 \
            "$file" \
            -o "$file"

          done



      # ==========================
      # JS MINIFY
      # ==========================

      - name: Minify JavaScript

        run: |

          find dist -type f -name "*.js" | while read file

          do

            terser "$file" \
            --compress \
            --mangle \
            --comments false \
            -o "$file"

          done



      # ==========================
      # JS OBFUSCATION
      # ==========================

      - name: Obfuscate JavaScript

        run: |

          find dist -type f -name "*.js" | while read file

          do

            javascript-obfuscator "$file" \
            --output "$file" \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.15 \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending true \
            --string-array true \
            --string-array-encoding base64 \
            --split-strings true \
            --disable-console-output true

          done



      # ==========================
      # CACHE BUSTING
      # ==========================

      - name: Generate Build Version

        run: |

          echo "BUILD_VERSION=$(date +%s)" >> $GITHUB_ENV



      - name: Add Cache Version

        run: |

          find dist -type f -name "*.html" | while read file

          do

            sed -i \
            "s|main.css|main.css?v=${BUILD_VERSION}|g" \
            "$file"


            sed -i \
            "s|app.js|app.js?v=${BUILD_VERSION}|g" \
            "$file"


            sed -i \
            "s|manifest.json|manifest.json?v=${BUILD_VERSION}|g" \
            "$file"

          done



      # ==========================
      # SECURITY HEADERS
      # ==========================

      - name: Create Security Headers

        run: |

          printf '%s\n' \
          "/*" \
          "  X-Frame-Options: SAMEORIGIN" \
          "  X-Content-Type-Options: nosniff" \
          "  Referrer-Policy: strict-origin-when-cross-origin" \
          > dist/_headers



      # ==========================
      # HASH MANIFEST
      # ==========================

      - name: Generate Integrity Hashes

        run: |

          cd dist

          sha256sum $(find . -type f) > integrity.txt



      # ==========================
      # CREATE CLOUDFLARE PROJECT
      # ==========================

      - name: Create Cloudflare Pages Project If Missing

        env:

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          if wrangler pages project list | grep -q "$PROJECT_NAME"

          then

            echo "Project exists"

          else

            wrangler pages project create "$PROJECT_NAME" \
            --production-branch main

          fi



      # ==========================
      # DEPLOY
      # ==========================

      - name: Deploy Cloudflare Pages

        env:

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          wrangler pages deploy dist \
          --project-name="$PROJECT_NAME" \
          --commit-dirty=true



      # ==========================
      # SUCCESS
      # ==========================

      - name: Deployment Complete

        run: |

          echo "VIDHWAAN AI WRITER DEPLOYMENT SUCCESSFUL"
